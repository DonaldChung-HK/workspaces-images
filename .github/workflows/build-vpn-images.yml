name: Build & Publish VPN Images (Weekly)

on:
  schedule:
    # Weekly: Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: donaldchung-hk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-noble-desktop-vpn-light
            dockerfile: dockerfile-kasm-ubuntu-noble-desktop-vpn-light
          - name: debian-trixie-desktop-vpn-light
            dockerfile: dockerfile-kasm-debian-trixie-desktop-vpn-light
          - name: firefox-vpn
            dockerfile: dockerfile-kasm-firefox-vpn
          - name: brave-vpn
            dockerfile: dockerfile-kasm-brave-vpn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}"
          DATE_TAG="$(date -u +%Y%m%d)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:${DATE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
